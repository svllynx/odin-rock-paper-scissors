<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <p class="info">First to 5 points wins!</p>

  <div class="buttons">
    <button data-choice="rock">✊ Rock</button>
    <button data-choice="paper">✋ Paper</button>
    <button data-choice="scissors">✌️ Scissors</button>
  </div>

  <div class="score">
    <p>You: <span id="human-score">0</span></p>
    <p>Computer: <span id="computer-score">0</span></p>
  </div>

  <p id="result">Pick one to start.</p>
  <button id="reset" class="hidden">Play Again</button>

  <script src="script.js"></script>
</body>
</html>
